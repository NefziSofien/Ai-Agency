name: agence-ia

# Profils :
#   core          Postgres+pgvector, Redis, stockage S3 (RustFS), SearXNG
#   observability Langfuse (web + worker + ClickHouse)
#   automation    n8n
#   social        Postiz (+ Temporal)
#   crm           Twenty CRM + Listmonk
#
#   docker compose --profile core up -d
#   docker compose --profile core --profile automation --profile social up -d
#
# OmniRoute tourne sur l'hôte (port 20129) : les conteneurs l'atteignent via host.docker.internal.

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [core]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agence
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d agence"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles: [core]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Stockage objet compatible S3 (MinIO ne publie plus d'images Docker).
  s3:
    image: rustfs/rustfs:latest
    profiles: [core]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3data:/data

  s3-init:
    image: amazon/aws-cli:latest
    profiles: [core]
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do aws --endpoint-url http://s3:9000 s3 ls >/dev/null 2>&1 && break; sleep 2; done;
      for b in ${S3_BUCKET_ASSETS} langfuse; do
        aws --endpoint-url http://s3:9000 s3 mb s3://$$b 2>&1 | grep -v BucketAlreadyOwnedByYou || true;
      done
      "

  searxng:
    image: searxng/searxng:latest
    profiles: [core]
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro

  # ---------------- Observabilité ----------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: [observability]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhousedata:/var/lib/clickhouse
      - clickhouselogs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-worker: &langfuse
    image: langfuse/langfuse-worker:3
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://s3:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: agence
      LANGFUSE_INIT_ORG_NAME: Agence IA
      LANGFUSE_INIT_PROJECT_ID: agence-ia
      LANGFUSE_INIT_PROJECT_NAME: agence-ia
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${ADMIN_PASSWORD}

  langfuse-web:
    <<: *langfuse
    image: langfuse/langfuse:3
    ports:
      - "127.0.0.1:3001:3000"

  # ---------------- Automatisations ----------------
  n8n:
    image: n8nio/n8n:latest
    profiles: [automation]
    restart: unless-stopped
    <<: *host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      AGENCE_API_URL: http://host.docker.internal:8000
      AGENCE_API_KEY: ${AGENCE_API_KEY}
      OMNIROUTE_BASE_URL: http://host.docker.internal:20129/v1
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

  # ---------------- Social ----------------
  temporal:
    image: temporalio/auto-setup:1.28.1
    profiles: [social]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES: "true"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_NAMESPACE: default
    volumes:
      - ./infra/temporal:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    profiles: [social]
    restart: unless-stopped
    <<: *host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      MAIN_URL: http://localhost:4007
      FRONTEND_URL: http://localhost:4007
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4007/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postiz
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      RUN_CRON: "true"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      OPENAI_API_KEY: ${OMNIROUTE_API_KEY}
      OPENAI_BASE_URL: http://host.docker.internal:20129/v1
    ports:
      - "127.0.0.1:4007:5000"
    volumes:
      - postizconfig:/config
      - postizuploads:/uploads

  # ---------------- CRM et emailing ----------------
  twenty:
    image: twentycrm/twenty:latest
    profiles: [crm]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &twenty-env
      NODE_PORT: "3000"
      PG_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/twenty
      SERVER_URL: http://localhost:3002
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_SECRET: ${TWENTY_APP_SECRET}
      STORAGE_TYPE: local
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - twentydata:/app/packages/twenty-server/.local-storage

  twenty-worker:
    image: twentycrm/twenty:latest
    profiles: [crm]
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    depends_on:
      - twenty
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
    volumes:
      - twentydata:/app/packages/twenty-server/.local-storage

  listmonk:
    image: listmonk/listmonk:latest
    profiles: [crm]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: [sh, -c, "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: postgres
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: ${POSTGRES_USER}
      LISTMONK_db__password: ${POSTGRES_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: admin
      LISTMONK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:9002:9000"

volumes:
  pgdata:
  redisdata:
  s3data:
  clickhousedata:
  clickhouselogs:
  n8ndata:
  postizconfig:
  postizuploads:
  twentydata:
